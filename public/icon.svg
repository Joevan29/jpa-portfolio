<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151d"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- App Icon Base Shape -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>
  
  <!-- Subtle Glow Behind Logo -->
  <circle cx="256" cy="256" r="140" fill="#A2FF00" opacity="0.06"/>
  
  <!-- Monogram JPA. -->
  <text x="240" y="318" text-anchor="middle" font-family="'Epilogue', system-ui, -apple-system, sans-serif" font-weight="900" font-size="150" letter-spacing="-5" fill="#ffffff">
    JPA<tspan fill="#A2FF00">.</tspan>
  </text>
</svg>
